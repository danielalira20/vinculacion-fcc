<article class="academy-card" data-searchable data-category="{{ item.short }}" data-search="{{ item.name }} {{ item.area }} {{ item.description }} {{ item.tags|join(' ') }}">
  <a class="academy-art theme-{{ item.theme }}" href="{{ url(item.path) }}" tabindex="-1" aria-hidden="true">
    <span class="art-grid">
</span>
<span class="art-orbit orbit-one">
</span>
<span class="art-orbit orbit-two">
</span>
    <span class="art-icon">{{ icon(item.icon) }}</span>
<span class="art-label">{{ item.short }}</span>
<span class="art-corner">{{ icon('arrow') }}</span>
  </a>
  <div class="academy-copy">
<p class="eyebrow">{{ item.area }}</p>
<h3>
<a href="{{ url(item.path) }}">{{ item.name }}</a>
</h3>
<p>{{ item.description }}</p>
<div class="card-bottom">
<div class="tags">{% for tag in item.tags %}<span>{{ tag }}</span>{% endfor %}</div>
<a class="circle-link" href="{{ url(item.path) }}" aria-label="Explorar {{ item.name }}">{{ icon('arrow') }}</a>
</div>
</div>
</article>
